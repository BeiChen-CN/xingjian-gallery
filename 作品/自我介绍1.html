<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>吕燕彤 · 个人介绍</title>
<style>
  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: #03081a;
    color: #e6f0ff;
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui,
                 -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 深蓝色渐变夜空 ---------- */
  .scene {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 15% 8%,  #123a8a 0%, rgba(18, 58, 138, 0) 55%),
      radial-gradient(90% 80% at 88% 90%,  #0b6a8c 0%, rgba(11, 106, 140, 0) 60%),
      radial-gradient(80% 70% at 62% 45%,  #2a2a86 0%, rgba(42, 42, 134, 0) 65%),
      linear-gradient(165deg, #04081c 0%, #061634 38%, #04102e 62%, #020616 100%);
  }

  /* 缓慢飘移的星云光斑 */
  .scene::before {
    content: "";
    position: absolute;
    inset: -25%;
    background:
      radial-gradient(45% 45% at 30% 30%, rgba(46, 104, 214, 0.35), transparent 70%),
      radial-gradient(40% 40% at 72% 68%, rgba(26, 150, 190, 0.22), transparent 70%);
    filter: blur(30px);
    animation: drift 26s ease-in-out infinite alternate;
  }

  @keyframes drift {
    from { transform: translate3d(-3%, -2%, 0) scale(1); }
    to   { transform: translate3d(4%, 3%, 0) scale(1.12); }
  }

  /* ---------- 星空画布 ---------- */
  #sky {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: block;
  }

  /* ---------- 文字内容 ---------- */
  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8vh 24px;
    user-select: none;
  }

  /* 循环淡入淡出 */
  .line {
    opacity: 0;
    animation: fadeCycle 14s ease-in-out infinite;
    animation-delay: var(--d, 0s);
    will-change: opacity, transform;
  }

  @keyframes fadeCycle {
    0%   { opacity: 0; transform: translateY(22px); filter: blur(6px); }
    9%   { opacity: 1; transform: translateY(0);    filter: blur(0); }
    72%  { opacity: 1; transform: translateY(0);    filter: blur(0); }
    88%  { opacity: 0; transform: translateY(-16px); filter: blur(6px); }
    100% { opacity: 0; transform: translateY(-16px); filter: blur(6px); }
  }

  .greet {
    margin: 0;
    font-size: clamp(0.85rem, 1.6vw, 1.05rem);
    letter-spacing: 0.55em;
    text-indent: 0.55em;
    color: #9dc0f0;
  }

  .name {
    margin: 0.12em 0 0.22em;
    font-size: clamp(3rem, 12vw, 8.5rem);
    font-weight: 800;
    letter-spacing: 0.08em;
    text-indent: 0.08em;
    background: linear-gradient(180deg, #ffffff 0%, #d3e6ff 36%, #77abff 72%, #3f74d6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 10px 42px rgba(70, 130, 255, 0.45));
  }

  .role {
    margin: 0;
    font-size: clamp(0.95rem, 2.1vw, 1.3rem);
    letter-spacing: 0.2em;
    text-indent: 0.2em;
    color: #cfe0ff;
  }

  .dot {
    display: inline-block;
    width: 0.5em;
    height: 0.5em;
    margin-right: 0.6em;
    border-radius: 50%;
    background: #6aa6ff;
    box-shadow: 0 0 12px #4d8cff, 0 0 28px rgba(77, 140, 255, 0.6);
    vertical-align: middle;
  }

  .hobby {
    margin: 0.9em 0 0;
    font-size: clamp(1rem, 2vw, 1.2rem);
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    color: #eaf3ff;
  }

  .swatches {
    display: inline-flex;
    gap: 6px;
    margin-left: 0.8em;
    vertical-align: middle;
  }

  .swatches i {
    display: block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .swatches i:nth-child(1) { background: #2f6fd0; box-shadow: 0 0 10px rgba(47, 111, 208, 0.9); }
  .swatches i:nth-child(2) { background: #5aa0ff; box-shadow: 0 0 10px rgba(90, 160, 255, 0.9); }
  .swatches i:nth-child(3) { background: #a8d4ff; box-shadow: 0 0 10px rgba(168, 212, 255, 0.9); }

  .tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 2.2em 0 0;
    padding: 0;
    list-style: none;
  }

  .tags li {
    padding: 7px 18px;
    font-size: 0.82rem;
    letter-spacing: 0.16em;
    text-indent: 0.16em;
    color: #bcd6ff;
    border: 1px solid rgba(140, 180, 255, 0.26);
    border-radius: 999px;
    background: rgba(80, 130, 220, 0.12);
    backdrop-filter: blur(4px);
  }

  .hint {
    position: absolute;
    left: 50%;
    bottom: 22px;
    z-index: 2;
    transform: translateX(-50%);
    margin: 0;
    font-size: 0.72rem;
    letter-spacing: 0.24em;
    text-indent: 0.24em;
    color: rgba(170, 200, 240, 0.38);
    animation: breathe 4.5s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 0.85; }
  }

  @media (max-width: 520px) {
    .greet { letter-spacing: 0.4em; }
    .tags li { padding: 6px 14px; font-size: 0.76rem; }
  }

  /* 无障碍：尊重系统「减少动态效果」设置 */
  @media (prefers-reduced-motion: reduce) {
    .line, .scene::before, .hint {
      animation: none !important;
      opacity: 1;
      transform: none;
      filter: none;
    }
  }
</style>
<link rel="stylesheet" href="返回展厅.css">
<script src="入场过渡.js"></script>
</head>
<body>
<a class="exhibition-return" href="../学员AI作品展.html" aria-label="返回作品展首页">← 返回作品展首页</a>

<div class="scene">
  <canvas id="sky" aria-hidden="true"></canvas>

  <main class="content">
    <p class="line greet" style="--d: 0s">你好，我是</p>
    <h1 class="line name" style="--d: 0.45s">吕燕彤</h1>
    <p class="line role" style="--d: 0.9s"><span class="dot"></span>计算机专业 · Computer Science</p>
    <p class="line hobby" style="--d: 1.35s">
      喜欢蓝色
      <span class="swatches"><i></i><i></i><i></i></span>
    </p>
    <ul class="line tags" style="--d: 1.8s">
      <li>代码</li>
      <li>算法</li>
      <li>界面</li>
      <li>星空</li>
    </ul>
  </main>

  <p class="hint">移动鼠标 · 点击屏幕</p>
</div>

<script>
(function () {
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = window.innerWidth;
  let H = window.innerHeight;
  let dpr = 1;

  const stars = [];      // 闪烁的星星
  const flakes = [];     // 飘落的粒子
  const sparks = [];     // 点击迸发的光点
  let shootingStar = null;
  let shootTimer = 3;

  const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
  const rand = (a, b) => a + Math.random() * (b - a);

  /* 预渲染一张光晕贴图，避免每帧重建渐变（性能关键） */
  const glow = document.createElement('canvas');
  glow.width = glow.height = 64;
  (function () {
    const g = glow.getContext('2d');
    const rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    rg.addColorStop(0, 'rgba(200, 226, 255, 0.95)');
    rg.addColorStop(0.28, 'rgba(120, 175, 255, 0.35)');
    rg.addColorStop(1, 'rgba(120, 175, 255, 0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, 64, 64);
  })();

  function build() {
    const area = W * H;

    stars.length = 0;
    const starCount = Math.min(260, Math.round(area / 7000));
    for (let i = 0; i < starCount; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: rand(0.4, 1.7),
        a: rand(0.25, 0.85),
        tw: rand(0.6, 2.2),        // 闪烁速度
        ph: Math.random() * Math.PI * 2,
        depth: rand(0.15, 1)       // 视差深度
      });
    }

    flakes.length = 0;
    const flakeCount = Math.min(90, Math.round(area / 22000));
    for (let i = 0; i < flakeCount; i++) {
      flakes.push(makeFlake(true));
    }
  }

  function makeFlake(anywhere) {
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : -20,
      r: rand(0.8, 2.2),
      vy: rand(7, 26),            // 下落速度 px/s
      sway: rand(8, 26),          // 左右摇摆幅度
      ph: Math.random() * Math.PI * 2,
      sp: rand(0.4, 1.1),
      a: rand(0.15, 0.5)
    };
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
    if (reduced) drawStatic();
  }

  function drawStatic() {
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(215, 235, 255, ' + s.a.toFixed(2) + ')';
      ctx.fill();
    }
  }

  let last = performance.now();

  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    // 鼠标视差平滑跟随
    pointer.x += (pointer.tx - pointer.x) * 0.05;
    pointer.y += (pointer.ty - pointer.y) * 0.05;
    const ox = pointer.x * 16;
    const oy = pointer.y * 16;

    ctx.clearRect(0, 0, W, H);

    /* --- 星星闪烁 --- */
    for (const s of stars) {
      s.ph += s.tw * dt;
      const tw = 0.5 + 0.5 * Math.sin(s.ph);
      const a = s.a * (0.35 + 0.65 * tw);
      const x = s.x + ox * s.depth;
      const y = s.y + oy * s.depth;

      if (s.r > 1.15) {                       // 大星星带光晕
        const size = s.r * 9;
        ctx.globalAlpha = a * 0.55;
        ctx.drawImage(glow, x - size / 2, y - size / 2, size, size);
        ctx.globalAlpha = 1;
      }
      ctx.beginPath();
      ctx.arc(x, y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(218, 237, 255, ' + a.toFixed(3) + ')';
      ctx.fill();
    }

    /* --- 粒子飘落 --- */
    for (const f of flakes) {
      f.ph += f.sp * dt;
      f.y += f.vy * dt;
      if (f.y > H + 12) {                     // 落到底部后从顶部重生
        f.y = -12;
        f.x = Math.random() * W;
      }
      const x = f.x + Math.sin(f.ph) * f.sway + ox * 0.5;
      ctx.beginPath();
      ctx.arc(x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(150, 200, 255, ' + f.a + ')';
      ctx.fill();
    }

    /* --- 偶尔划过的流星 --- */
    shootTimer -= dt;
    if (!shootingStar && shootTimer <= 0) {
      shootingStar = {
        x: rand(W * 0.15, W * 0.95),
        y: rand(-40, H * 0.35),
        vx: rand(-320, -180),
        vy: rand(140, 240),
        life: 1
      };
      shootTimer = rand(4, 9);
    }
    if (shootingStar) {
      const s = shootingStar;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.life -= dt * 0.75;
      if (s.life <= 0 || s.y > H + 60 || s.x < -80) {
        shootingStar = null;
      } else {
        const len = 90;
        const n = Math.hypot(s.vx, s.vy);
        const nx = s.vx / n;
        const ny = s.vy / n;
        const g = ctx.createLinearGradient(s.x, s.y, s.x - nx * len, s.y - ny * len);
        g.addColorStop(0, 'rgba(224, 242, 255, ' + (0.9 * s.life).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(140, 190, 255, 0)');
        ctx.strokeStyle = g;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x - nx * len, s.y - ny * len);
        ctx.stroke();
      }
    }

    /* --- 点击迸发的光点 --- */
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.vy += 14 * dt;                        // 轻微重力
      p.life -= dt * 0.9;
      if (p.life <= 0) {
        sparks.splice(i, 1);
        continue;
      }
      const size = p.r * 9;
      ctx.globalAlpha = p.life;
      ctx.drawImage(glow, p.x - size / 2, p.y - size / 2, size, size);
      ctx.globalAlpha = 1;
    }

    requestAnimationFrame(loop);
  }

  /* --- 交互 --- */
  window.addEventListener('mousemove', function (e) {
    pointer.tx = (e.clientX / W - 0.5) * 2;
    pointer.ty = (e.clientY / H - 0.5) * 2;
  });
  window.addEventListener('mouseleave', function () {
    pointer.tx = pointer.ty = 0;
  });

  window.addEventListener('pointerdown', function (e) {
    if (reduced) return;
    for (let i = 0; i < 16; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = rand(40, 160);
      sparks.push({
        x: e.clientX,
        y: e.clientY,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        r: rand(0.6, 1.6),
        life: 1
      });
    }
  });

  window.addEventListener('resize', resize);

  /* --- 启动 --- */
  resize();
  if (!reduced) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
