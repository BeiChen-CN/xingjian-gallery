<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090e13">
<title>星间 · 学员 AI 作品展</title>
<style>
:root{color-scheme:dark;--paper:#ede8db;--muted:#9aa8a9;--gold:#ccb184;--line:#ccb18430;--ease:cubic-bezier(.22,.61,.36,1);--sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,"Segoe UI",sans-serif;--serif:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","STZhongsong","Songti SC","STSong","SimSun",serif;--mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090e13;color:var(--paper);font-family:var(--sans)}button,input,a{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{opacity:.38;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:5px}::selection{background:#ccb18440;color:#fff}
.cosmos{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 72% 46%,#34514e34,transparent 49%),radial-gradient(ellipse at 32% 68%,#58403828,transparent 44%),radial-gradient(ellipse at 86% 12%,#66513c20,transparent 40%),#090e13}
.atlas{position:absolute;right:-10%;top:-12%;width:95%;height:120%;color:#c9b38c;opacity:.17;transform:rotate(-14deg);mask-image:linear-gradient(90deg,transparent,#000 32%,#000 88%,transparent)}
.grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.045;mix-blend-mode:screen}
#scene{position:fixed;inset:0;touch-action:none;cursor:grab;opacity:0}#scene:active{cursor:grabbing}#scene canvas{display:block;width:100%;height:100%}
.atmosphere{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 34%,#090e1345 100%),linear-gradient(180deg,#090e1380,transparent 18%,transparent 78%,#090e1390)}
.top{position:absolute;z-index:4;top:0;left:4.5%;right:4.5%;height:112px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);pointer-events:none}.top>*{pointer-events:auto}.brand{display:flex;align-items:center;gap:17px}.mark{position:relative;display:grid;place-items:center;width:46px;height:46px;border:1px solid #c8ad7e85;border-radius:50%;color:var(--gold);font:30px var(--serif)}.mark:before,.mark:after{content:"";position:absolute;inset:7px -6px;border:1px solid #c8ad7e70;border-radius:50%;transform:rotate(-38deg)}.mark:after{inset:-6px 7px;transform:rotate(-38deg);border-color:#c8ad7e38}.brand h1{margin:0;font:25px var(--serif);letter-spacing:.28em}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;margin-top:6px}.controls{display:flex;align-items:center;gap:20px}.btn{min-height:44px;padding:10px 16px;border:1px solid transparent;background:transparent;color:var(--paper);font-size:12px;letter-spacing:.08em;transition:color .3s,background .3s,border-color .3s,transform .3s}.btn:hover{color:var(--gold);border-color:var(--line)}.btn.primary-btn{border-color:#c8ad7e70;background:#c8ad7e0b;color:#e5d6b8}.btn.primary-btn:hover{background:#c8ad7e1f;transform:translateY(-2px)}#total{display:inline-block;margin-left:9px;color:var(--gold);font:12px var(--mono)}
.bottom-line{position:absolute;bottom:56px;left:4.5%;right:4.5%;height:1px;background:var(--line);pointer-events:none}.guide{position:absolute;left:50%;bottom:21px;transform:translateX(-50%);color:#899795;font-size:clamp(10px,.72vw,12px);line-height:1.6;letter-spacing:.04em;white-space:nowrap;pointer-events:none}
.focus{position:absolute;left:50%;bottom:84px;transform:translate(-50%,8px);min-width:230px;padding:15px 24px;border:1px solid #ccb18445;border-radius:6px;background:linear-gradient(120deg,#1b2826e8,#111a1de8);backdrop-filter:blur(20px);box-shadow:0 12px 50px #0005,inset 0 1px #e8d6b010;pointer-events:none;opacity:0;transition:opacity .4s var(--ease),transform .5s var(--ease);text-align:center}.focus.visible{opacity:1;transform:translate(-50%,0)}.focus strong{display:block;font:17px var(--serif);letter-spacing:.08em;color:#eadcc0}.focus span{display:block;margin-top:8px;color:#a7b1a9;font-size:11px}
.labels{position:absolute;inset:0;pointer-events:none}.label{position:absolute;transform:translateX(-50%);white-space:nowrap;text-align:center;line-height:1.45;text-shadow:0 1px 2px #000c,0 6px 22px #000b;font-size:13px;letter-spacing:.08em;color:#d8d2c3;transition:color .35s cubic-bezier(.22,.61,.36,1),opacity .45s cubic-bezier(.22,.61,.36,1)}.label:before{content:"";display:block;width:1px;height:20px;margin:0 auto 8px;background:linear-gradient(transparent,#c9b38c90)}.label strong{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.1em;color:#fff4de;text-shadow:0 1px 2px #000e,0 6px 24px #000d}.label small{display:block;margin-top:1px;color:#a9b0a5;font:clamp(10.5px,.72vw,12px)/1.7 var(--sans);letter-spacing:.16em}.label.active{color:#f3dba7}.label.active strong{color:#ffe6b4}.label.active small{color:#d3c3a6}
.label-index{display:inline-block;margin-right:7px;font:9px var(--mono);letter-spacing:.06em;color:#c2a97f;vertical-align:1px}.label-index:after{content:" /"}
.panel{position:absolute;z-index:5;top:128px;right:4.5%;width:min(430px,calc(100vw - 32px));max-height:calc(100dvh - 156px);overflow:auto;padding:30px;border:1px solid #ccb18450;border-radius:8px;transform-origin:top right;scrollbar-width:thin;scrollbar-color:#bda77a50 transparent}.panel[hidden]{display:none}.panel-close{position:absolute;top:18px;right:18px;display:grid;place-items:center;width:40px;height:40px;padding:0;border:1px solid #ccb18438;border-radius:50%;background:transparent;color:#cbbd9f;font:18px/1 var(--sans);transition:color .3s var(--ease),background .3s var(--ease),border-color .3s var(--ease)}.panel-close:hover{background:#ccb18418;border-color:#ccb18470;color:#f4e6c8}.panel h2{font:28px var(--serif);font-weight:400;letter-spacing:.12em;margin:0 0 16px}.search{width:100%;padding:13px 0;border:0;border-bottom:1px solid #ccb18450;border-radius:0;background:transparent;color:var(--paper);font-size:13px;margin-bottom:10px;transition:border-color .3s var(--ease),box-shadow .3s var(--ease)}.search:focus{border-bottom-color:#d9c49a;box-shadow:0 2px 0 -1px #d9c49a}.search::placeholder{color:#8b998f}.list{display:grid;counter-reset:work}.work{display:flex;align-items:center;gap:10px;padding:20px 0;border-bottom:1px solid #ccb18426;counter-increment:work}.work:before{content:counter(work,decimal-leading-zero);align-self:flex-start;padding-top:3px;color:#baaa8b;font:10px var(--mono);margin-right:7px}.work .name{min-width:0;flex:1}.work strong{display:block;font-size:13px;line-height:1.8;font-weight:400;letter-spacing:.03em}.work button,.work a{display:grid;place-items:center;min-height:44px;min-width:44px;padding:7px;border:1px solid #ccb18435;border-radius:4px;background:transparent;color:#d5c7aa;text-decoration:none;font-size:12px;transition:background .3s var(--ease),border-color .3s var(--ease),transform .3s var(--ease),box-shadow .3s var(--ease)}.work a{border-color:#ccb18475;background:#ccb1840b}.work button:hover:enabled,.work a:hover{background:#ccb18420;border-color:var(--gold);box-shadow:inset 0 1px #f1dfba20;transform:translateY(-1px)}
.top{border-bottom-color:#d2c09b26}.brand .mark{box-shadow:inset 0 0 18px #c8ad7e0a,0 0 26px #c8ad7e06}.scene-ready .mark:before{animation:brand-orbit 48s linear infinite}.btn.primary-btn{position:relative;overflow:hidden;border-color:#d3be9355;background:linear-gradient(135deg,#c5b38b18,#c5b38b05);box-shadow:inset 0 1px #f0dfbb12,0 5px 20px #0002}.btn.primary-btn:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,#f4e1bc12 48%,transparent 75%);transform:translateX(-110%);transition:transform .8s cubic-bezier(.22,.61,.36,1);pointer-events:none}.btn.primary-btn:hover:after{transform:translateX(110%)}
.panel,.focus{background:linear-gradient(130deg,#364239e8,#142020ee 46%,#10191cf5);box-shadow:0 28px 80px #0008,0 6px 18px #0004,inset 0 1px #f2dfb938,inset 1px 0 #f2dfb910,inset 0 -1px #0006;border-color:#d5c09a46;backdrop-filter:blur(24px) saturate(115%)}.panel:before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,#e7cda870,transparent);pointer-events:none}.focus{overflow:hidden}.focus.visible:before{content:"";position:absolute;top:0;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,#e8d3a7aa,transparent);animation:edge-reveal .8s var(--ease) both}.work{transition:background .35s var(--ease),border-color .35s var(--ease)}.work:hover{background:#c8ad7e06;border-bottom-color:#d5c09a60}.work button:active,.work a:active{transform:translateY(1px)}
.scene-ready #scene{opacity:1;animation:scene-reveal 1.5s var(--ease) both}.scene-ready .top{animation:interface-reveal .9s .12s var(--ease) backwards}.scene-ready .guide{animation:interface-reveal .9s .9s var(--ease) backwards}.scene-ready .labels{animation:scene-reveal 1.8s .15s var(--ease) backwards}.directory-open .work{animation:row-reveal .42s calc(.06s * var(--row,0) + .05s) var(--ease) both}.directory-open .labels{opacity:.4}
@keyframes brand-orbit{from{transform:rotate(-38deg)}to{transform:rotate(322deg)}}@keyframes edge-reveal{from{opacity:0;transform:scaleX(.15)}to{opacity:1;transform:scaleX(1)}}@keyframes scene-reveal{from{opacity:0}to{opacity:1}}@keyframes interface-reveal{from{opacity:0;translate:0 -5px}to{opacity:1;translate:0 0}}@keyframes row-reveal{from{opacity:0;translate:8px 0}to{opacity:1;translate:0 0}}
.is-entering .top,.is-entering .guide,.is-entering .labels{animation:none;opacity:0}
.notice{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.error{position:absolute;z-index:3;left:50%;top:40%;transform:translateX(-50%);width:min(430px,calc(100vw - 36px));display:none;padding:28px;border:1px solid #ccb18460;background:#162321f2;color:#e6d8bb;font-size:13px;line-height:2;text-align:center}
#entry-veil{position:fixed;inset:0;z-index:20;background:#090e13;opacity:0;pointer-events:none}
#boot{position:fixed;inset:0;z-index:18;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 45%,#162220,#090e13 70%);color:#a9b0a5;text-align:center;transition:opacity .6s var(--ease),visibility 0s linear .6s}.scene-ready #boot{opacity:0;visibility:hidden}#boot .boot-star{display:block;color:var(--gold);font:34px/1 var(--serif);animation:boot-pulse 1.8s ease-in-out infinite}#boot p{margin:20px 0 0;font-size:12px;line-height:1.8;letter-spacing:.2em;color:#b7bfb4}@keyframes boot-pulse{0%,100%{opacity:.45;transform:scale(.94)}50%{opacity:1;transform:scale(1.02)}}.noscript{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:32px;background:#090e13;color:#e6d8bb;font-size:14px;line-height:2;text-align:center}
@media(prefers-reduced-motion:reduce){#boot .boot-star{animation:none}}
.top,.guide,.atlas,.labels,.bottom-line{transition:opacity .55s ease}
.is-entering .top,.is-entering .guide,.is-entering .atlas,.is-entering .labels,.is-entering .bottom-line{opacity:0;pointer-events:none}
.is-entering #entry-veil{will-change:opacity}
@media(max-width:760px){.top{left:20px;right:20px;height:85px;gap:10px}.brand{gap:11px}.mark{width:33px;height:33px;font-size:22px}.brand h1{font-size:19px}.brand small{font-size:10px;letter-spacing:.04em}.controls{gap:4px}.btn{padding:8px;font-size:11px}.btn.primary-btn{padding:8px 12px}#total{margin-left:6px;font-size:11px}.atlas{right:-65%;top:10%;width:175%;height:90%;opacity:.22}.atmosphere{background:linear-gradient(180deg,#090e13b0,transparent 45%,transparent 78%,#090e13b0)}.bottom-line{bottom:56px;left:20px;right:20px}.guide{bottom:21px;font-size:10.5px}.focus{bottom:78px;max-width:calc(100vw - 40px);min-width:210px;padding:12px 18px}.focus strong{font-size:15px}.focus span{font-size:10.5px}.label{font-size:11px}.label strong{font-size:16px}.panel-close{top:10px;right:10px;width:36px;height:36px;font-size:16px}.label small{font-size:10px}.label:before{height:14px;margin-bottom:5px}.panel{top:98px;right:16px;padding:24px;max-height:calc(100dvh - 120px)}.panel h2{font-size:25px}.error{top:43%}}
@media(max-height:650px) and (min-width:761px){.top{height:80px}.panel{top:92px;max-height:calc(100dvh - 110px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head><body>
<div id="boot" role="status" aria-live="polite"><span class="boot-star" aria-hidden="true">✦</span><p id="boot-text">正在生成星体…</p></div>
<noscript><div class="noscript">三维展厅需要启用 JavaScript。<br>请启用后刷新，或直接打开“作品”文件夹中的 HTML。</div></noscript>
<div class="cosmos" aria-hidden="true"><svg class="atlas" viewBox="0 0 1000 800" fill="none"><g stroke="currentColor" stroke-width=".55"><path d="M462 82C731 59 951 274 946 534M395 722H900M488 73v16m74-12-2 16m75-6-4 16m70 11-7 14m61 27-9 13m55 41-12 10m41 54-14 7m27 61-16 4m12 68-16 1M440 714v16m80-16v16m80-16v16m80-16v16m80-16v16m80-16v16"/></g></svg></div>
<main id="scene" aria-label="学员作品展，可拖动旋转、滚轮或双指缩放，也可通过作品目录进入作品。"></main>
<div class="atmosphere" aria-hidden="true"></div><svg class="grain" aria-hidden="true"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#grain)" opacity=".5"/></svg><div class="labels" id="labels" aria-hidden="true"></div>
<header class="top"><div class="brand"><span class="mark" aria-hidden="true">✦</span><div><h1>星间</h1><small>学员 AI 作品展</small></div></div><nav class="controls" aria-label="展厅导航"><button class="btn" id="reset" aria-label="回到全景">全景</button><button class="btn primary-btn" id="toggle" aria-expanded="false" aria-controls="panel">作品 <span id="total"></span></button></nav></header>
<div class="bottom-line" aria-hidden="true"></div><div class="guide">拖动旋转 · 滚轮 / 双指缩放 · 点击星球进入</div>
<div id="focus" class="focus" aria-live="polite"><strong></strong><span></span></div><div id="notice" class="notice" role="status"></div><div id="error" class="error" role="alert">三维场景不可用，请从作品目录进入。</div>
<div id="entry-veil" aria-hidden="true"></div>
<aside class="panel" id="panel" aria-labelledby="panel-title" hidden><h2 id="panel-title">作品</h2><button class="panel-close" id="panel-close" aria-label="关闭作品目录">×</button><input class="search" id="search" type="search" placeholder="搜索姓名或作品" aria-label="搜索学员或作品"><div class="list" id="list"></div></aside>
<script src="./three.min.js"></script><script src="./作品数据.js"></script><script src="./宇宙展厅.js"></script>
</body></html>
